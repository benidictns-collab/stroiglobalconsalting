app: sgk-website
runtime: docker
port: 3000

build:
  - npm install --legacy-peer-deps
  - npm run build

start: npm run start

env:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"

plan: small
branch: main
